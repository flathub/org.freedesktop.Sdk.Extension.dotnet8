app-id: org.freedesktop.Sdk.Extension.dotnet8
branch: '26.08'
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet8/{bin,lib}
      - cp -r * /usr/lib/sdk/dotnet8/lib
      - ln -s /usr/lib/sdk/dotnet8/lib/dotnet /usr/lib/sdk/dotnet8/bin/dotnet
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0.426/dotnet-sdk-8.0.426-linux-x64.tar.gz
        sha256: bb691c98abc8797eedbd48d3a766bc734214aed746e52e2691d8bbb268c60764
        x-checker-data:
          type: html
          url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0/latest.version
          version-pattern: ^([\d\.a-z-]+)$
          url-template: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz
          release-url-template: https://github.com/dotnet/core/blob/main/release-notes/8.0/$version/$version.md
          is-main-source: true
      - type: archive
        only-arches: [aarch64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0.426/dotnet-sdk-8.0.426-linux-arm64.tar.gz
        sha256: efed09de05d15406aecd8f60da389fb436103171923c67c28b42b7285c2af818
