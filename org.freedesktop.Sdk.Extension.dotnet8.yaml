app-id: org.freedesktop.Sdk.Extension.dotnet8
branch: '23.08'
runtime: org.freedesktop.Sdk
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet8/{bin,lib}
      - cp -r * /usr/lib/sdk/dotnet8/lib
      - ln -s /usr/lib/sdk/dotnet8/lib/dotnet /usr/lib/sdk/dotnet8/bin/dotnet
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0.425/dotnet-sdk-8.0.425-linux-x64.tar.gz
        sha256: ec2c55738f3aa16c58b2c0c565ce10ad6fea83925574a6f08c920ba62a39712b
        x-checker-data:
          type: html
          url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0/latest.version
          version-pattern: ^([\d\.a-z-]+)$
          url-template: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz
          release-url-template: https://github.com/dotnet/core/blob/main/release-notes/8.0/$version/$version.md
          is-main-source: true
      - type: archive
        only-arches: [aarch64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0.425/dotnet-sdk-8.0.425-linux-arm64.tar.gz
        sha256: 1bd832a57b00b5c50fb10f847d79401d99175469d58241f92933dc14d253b57f
