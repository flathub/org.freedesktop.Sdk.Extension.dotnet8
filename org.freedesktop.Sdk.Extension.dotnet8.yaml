app-id: org.freedesktop.Sdk.Extension.dotnet8
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet8/{bin,lib}
      - cp -r * /usr/lib/sdk/dotnet8/lib
      - ln -s /usr/lib/sdk/dotnet8/lib/dotnet /usr/lib/sdk/dotnet8/bin/dotnet
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0.422/dotnet-sdk-8.0.422-linux-x64.tar.gz
        sha256: 72b0d393832c7d170653f5e61287bd19bd56419d85a0f6a9cf4a0f9762c845fc
        x-checker-data:
          type: html
          url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0/latest.version
          version-pattern: ^([\d\.a-z-]+)$
          url-template: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz
      - type: archive
        only-arches: [aarch64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0.422/dotnet-sdk-8.0.422-linux-arm64.tar.gz
