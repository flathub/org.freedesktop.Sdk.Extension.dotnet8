app-id: org.freedesktop.Sdk.Extension.dotnet8
branch: '23.08'
runtime: org.freedesktop.Sdk
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet8/{bin,lib}
      - cp -r * /usr/lib/sdk/dotnet8/lib
      - ln -s /usr/lib/sdk/dotnet8/lib/dotnet /usr/lib/sdk/dotnet8/bin/dotnet
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0.420/dotnet-sdk-8.0.420-linux-x64.tar.gz
        sha256: 7e3c39f54e6412a807df3e8e59ff3338a3a4c4923db35f6164808586535071c3
        x-checker-data:
          type: html
          url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0/latest.version
          version-pattern: ^([\d\.a-z-]+)$
          url-template: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz
      - type: archive
        only-arches: [aarch64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/8.0.420/dotnet-sdk-8.0.420-linux-arm64.tar.gz
        sha256: f1e12e7d633393054b6431046dcb01f2cfe4c5ccff234f730f0c3f7f8706bc42
